<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>FLIPFALL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:white}body{touch-action:none}canvas{display:block;width:100%;height:100%;background:#05060d}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.panel{pointer-events:auto;text-align:center;padding:28px 24px;width:min(88vw,390px);border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(10,12,24,.78);backdrop-filter:blur(20px);box-shadow:0 20px 80px #0008}.hidden{display:none}.logo{font-size:48px;font-weight:900;letter-spacing:-3px}.tag{opacity:.6;letter-spacing:4px;font-size:11px;margin:6px 0 24px}.btn{border:0;border-radius:16px;padding:16px 28px;font-size:17px;font-weight:800;color:#071018;background:#b8ffef;box-shadow:0 0 30px #78ffe755;min-width:190px}.sub{opacity:.7;font-size:13px;margin-top:18px}.stat{font-size:38px;font-weight:900;margin:8px}.small{opacity:.65;font-size:12px}.hud{position:fixed;top:calc(env(safe-area-inset-top) + 18px);left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}.score{font-size:28px;font-weight:900}.combo{font-size:12px;letter-spacing:2px;opacity:.75}.sound{pointer-events:auto;border:1px solid #fff3;background:#ffffff10;color:#fff;border-radius:12px;width:42px;height:42px;font-size:19px}.toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);font-size:22px;font-weight:900;opacity:0;transition:.2s;text-shadow:0 0 20px #fff}.toast.show{opacity:1}</style></head><body><canvas id="c"></canvas><div class="hud"><div><div id="score" class="score">0</div><div id="combo" class="combo">BEST 0</div></div><button id="sound" class="sound">🔊</button></div><div id="menu" class="overlay"><div class="panel"><div class="logo">FLIPFALL</div><div class="tag">ONE TAP. ONE CHANCE.</div><button id="play" class="btn">PLAY</button><div class="sub">Tap to flip gravity • Survive • Chase your best</div></div></div><div id="over" class="overlay hidden"><div class="panel"><div class="small">RUN OVER</div><div id="final" class="stat">0</div><div id="best" class="small">BEST 0</div><br><button id="again" class="btn">TRY AGAIN</button><div style="height:10px"></div><button id="home" class="btn" style="background:#fff1;color:#fff">HOME</button></div></div><div id="toast" class="toast"></div><script>
const C=document.getElementById('c'),x=C.getContext('2d');let W,H,dpr,raf,last=0,state='menu',score=0,best=+(localStorage.ffBest||0),combo=0,muted=localStorage.ffMute==='1',player,obs=[],parts=[],stars=[],shake=0,spawn=0,speed=5.2,started=false,audio;
const menu=document.getElementById('menu'),over=document.getElementById('over'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),sound=document.getElementById('sound');sound.textContent=muted?'🔇':'🔊';
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);makeStars()}addEventListener('resize',resize);resize();
function makeStars(){stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.3,s:Math.random()*18+5}))}
function tone(freq,dur=.07,type='sine',gain=.035){if(muted)return;if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function sfx(kind){if(kind==='flip'){tone(420,.06,'triangle',.045);setTimeout(()=>tone(700,.08,'triangle',.03),25)}if(kind==='score')tone(900,.06,'sine',.035);if(kind==='combo'){tone(620,.07,'square',.025);setTimeout(()=>tone(980,.1,'square',.02),45)}if(kind==='die'){tone(150,.18,'sawtooth',.05);setTimeout(()=>tone(80,.25,'sawtooth',.03),80)}if(kind==='click')tone(280,.05,'sine',.025)}
function reset(){score=0;combo=0;speed=5.2;spawn=.3;obs=[];parts=[];player={x:W*.25,y:H*.7,r:15,top:false,vy:0,flipLock:0,trail:[]};state='play';menu.classList.add('hidden');over.classList.add('hidden');updateHUD();sfx('click');if(audio&&audio.state==='suspended')audio.resume()}
function updateHUD(){scoreEl.textContent=score;comboEl.textContent=combo?`COMBO x${combo} • BEST ${best}`:`BEST ${best}`}
function flip(){if(state!=='play'||player.flipLock>0)return;player.top=!player.top;player.flipLock=.13;player.vy=player.top?-13:13;combo++;sfx('flip');burst(player.x,player.y,8);if(combo>1)sfx('combo');showToast(combo>1?`COMBO x${combo}`:'FLIP!')}
function spawnObs(){let top=Math.random()<.5;let shape=Math.random();let kind=shape<.34?'block':shape<.67?'diamond':'spike';let h=kind==='spike'?52:42,w=kind==='diamond'?44:kind==='spike'?38:38;obs.push({x:W+50,y:top?H*.25:H*.75,w,h,top,kind,passed:false,rot:Math.random()*6});}
function burst(px,py,n){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:.5+Math.random()*.4,r:2+Math.random()*3})}
function showToast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),350)}
function gameOver(){if(state!=='play')return;state='over';sfx('die');shake=14;burst(player.x,player.y,35);if(score>best){best=score;localStorage.ffBest=best}document.getElementById('final').textContent=score;document.getElementById('best').textContent=`BEST ${best}`;setTimeout(()=>over.classList.remove('hidden'),450)}
function update(dt){if(state!=='play')return;player.flipLock=Math.max(0,player.flipLock-dt);let target=player.top?H*.25:H*.75;player.vy+=(target-player.y)*.035;player.vy*=.88;player.y+=player.vy;player.trail.push({x:player.x,y:player.y});if(player.trail.length>9)player.trail.shift();spawn-=dt;if(spawn<=0){spawnObs();spawn=Math.max(.48,1.05-score*.004)}speed=Math.min(11,5.2+score*.025);for(let o of obs){o.x-=speed*60*dt;if(!o.passed&&o.x+o.w/2<player.x){o.passed=true;score++;sfx('score');if(score%10===0)showToast('NICE!')}}obs=obs.filter(o=>o.x>-80);for(let p of parts){p.x+=p.vx*60*dt;p.y+=p.vy*60*dt;p.vy+=8*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);for(let o of obs){let same=o.top===player.top;let dx=Math.abs(player.x-o.x),dy=Math.abs(player.y-o.y);if(same&&dx<(o.w/2+player.r-4)&&dy<(o.h/2+player.r-5))gameOver()}if(player.y<20||player.y>H-20)gameOver();updateHUD()}
function draw(){x.save();if(shake){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;if(shake<.2)shake=0}let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090b18');g.addColorStop(.5,'#05060d');g.addColorStop(1,'#100719');x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);for(let s of stars){s.y+=s.s*.016;if(s.y>H)s.y=0;x.globalAlpha=.25+s.r*.2;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}x.globalAlpha=1; // lanes
x.strokeStyle='#78ffe522';x.lineWidth=2;for(let yy of [H*.25,H*.75]){x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke();for(let k=0;k<8;k++){x.fillStyle='#78ffe51c';x.fillRect((k*180-(performance.now()/8)%180),yy-1,70,2)}}
// obstacles
for(let o of obs){x.save();x.translate(o.x,o.y);x.rotate(o.kind==='diamond'?Math.PI/4:0);x.shadowBlur=18;x.shadowColor='#ff4d8d';x.fillStyle='#ff4d8d';if(o.kind==='block')x.fillRect(-o.w/2,-o.h/2,o.w,o.h);else if(o.kind==='diamond')x.fillRect(-o.w/2,-o.h/2,o.w,o.h);else{ x.beginPath();x.moveTo(-o.w/2,o.h/2);x.lineTo(0,-o.h/2);x.lineTo(o.w/2,o.h/2);x.closePath();x.fill()}x.restore()}
// player trail
for(let i=0;i<player.trail.length;i++){let p=player.trail[i],a=i/player.trail.length*.25;x.globalAlpha=a;x.fillStyle='#b8ffef';x.beginPath();x.arc(p.x,p.y,player.r*(i/player.trail.length),0,7);x.fill()}x.globalAlpha=1;x.shadowBlur=25;x.shadowColor='#b8ffef';x.fillStyle='#eaffff';x.beginPath();x.arc(player.x,player.y,player.r,0,7);x.fill();x.shadowBlur=0;x.strokeStyle='#78ffe5';x.lineWidth=3;x.stroke();for(let p of parts){x.globalAlpha=Math.max(0,p.life);x.fillStyle='#b8ffef';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}x.globalAlpha=1;x.restore()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function startAudio(){if(!audio&&!muted)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio&&audio.state==='suspended')audio.resume()}
addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;startAudio();if(state==='play')flip()},{passive:true});document.getElementById('play').onclick=()=>{startAudio();reset()};document.getElementById('again').onclick=()=>{startAudio();reset()};document.getElementById('home').onclick=()=>{state='menu';over.classList.add('hidden');menu.classList.remove('hidden');sfx('click')};sound.onclick=e=>{e.stopPropagation();muted=!muted;localStorage.ffMute=muted?'1':'0';sound.textContent=muted?'🔇':'🔊';if(!muted){startAudio();sfx('click')}};
</script></body></html>
