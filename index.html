<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070912"><title>FLIPFALL v2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070912;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}body{touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}button{font:inherit}</style></head><body><canvas id="game"></canvas><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const TAU=Math.PI*2, bestKey='flipfall_best_v2';let best=+localStorage.getItem(bestKey)||0,state='menu',score=0,combo=0,elapsed=0,last=0,spawnT=0,shake=0,flash=0,particles=[],obs=[],stars=[];let player={lane:1,y:0,from:1,to:1,t:1,rot:0};let audio=null,musicGain=null,muted=false;
for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random(),s:Math.random()*2+.3,a:Math.random()*.7+.2});
function initAudio(){if(audio)return;try{audio=new (window.AudioContext||window.webkitAudioContext)();musicGain=audio.createGain();musicGain.gain.value=.035;musicGain.connect(audio.destination)}catch(e){}}
function tone(f,d,type='sine',gain=.06,delay=0){if(!audio||muted)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime+delay);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.7),audio.currentTime+delay+d);g.gain.setValueAtTime(0,audio.currentTime+delay);g.gain.linearRampToValueAtTime(gain,audio.currentTime+delay+.008);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+delay+d);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+d+.02)}
function noise(d=.12,gain=.035){if(!audio||muted)return;let b=audio.createBuffer(1,audio.sampleRate*d,audio.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);let s=audio.createBufferSource(),g=audio.createGain();g.gain.value=gain;s.buffer=b;s.connect(g);g.connect(audio.destination);s.start()}
function reset(){score=0;combo=0;elapsed=0;spawnT=.7;shake=0;flash=0;particles=[];obs=[];player={lane:1,y:laneY(1),from:1,to:1,t:1,rot:0};state='play';tone(520,.09,'square',.05);tone(780,.12,'square',.04,.06)}
function laneY(l){return l?H*.69:H*.31}function px(){return W*.24}function speed(){return Math.min(760,360+elapsed*15)}
function spawn(){let lane=Math.random()<.5?0:1;let r=Math.random();let type=r<.55?'block':r<.78?'diamond':r<.92?'bar':'orb';let h=type==='bar'?18:type==='orb'?34:54;let w=type==='bar'?105:type==='diamond'?52:48;obs.push({x:W+80,lane,type,w,h,passed:false,spin:Math.random()*TAU});}
function flip(){if(state!=='play')return;initAudio();if(audio&&audio.state==='suspended')audio.resume();if(player.t<1)return;player.from=player.lane;player.to=1-player.lane;player.t=0;combo=0;player.rot+=Math.PI;burst(px(),player.y,'flip');tone(330,.08,'triangle',.07);tone(660,.1,'triangle',.045,.035)}
function burst(px,py,kind){let n=kind==='death'?34:18;for(let i=0;i<n;i++){let a=Math.random()*TAU,sp=Math.random()*(kind==='death'?260:150)+30;particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.5+Math.random()*.5,size:Math.random()*4+2})}}
function gameover(){state='over';flash=.35;shake=16;burst(px(),player.y,'death');tone(90,.35,'sawtooth',.12);noise(.25,.05);if(score>best){best=score;localStorage.setItem(bestKey,best)}}
function pointInObs(o){let py=player.y;let oy=laneY(o.lane);let half=player.r=17;return Math.abs(o.x-px())<(o.w/2+half)&&Math.abs(py-oy)<(o.h/2+half)}
function update(dt){if(state==='play'){elapsed+=dt;spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.48,1.15-elapsed*.012)*(0.78+Math.random()*.35)}if(player.t<1){player.t=Math.min(1,player.t+dt/.16);let z=player.t*player.t*(3-2*player.t);player.y=laneY(player.from)+(laneY(player.to)-laneY(player.from))*z;if(player.t===1)player.lane=player.to}player.rot+=dt*4;let vx=speed();for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.x-=vx*dt;o.spin+=dt*3;if(!o.passed&&o.x<px()-o.w/2){o.passed=true;score++;combo++;tone(520+Math.min(combo,8)*45,.055,'square',.025);burst(px(),player.y,'score')}if(pointInObs(o)){gameover();break}if(o.x<-120)obs.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}shake*=Math.pow(.01,dt);flash=Math.max(0,flash-dt)}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#070912');g.addColorStop(.5,'#10152b');g.addColorStop(1,'#090b18');x.fillStyle=g;x.fillRect(0,0,W,H);stars.forEach(s=>{x.globalAlpha=s.a*(.65+.35*Math.sin(elapsed*2+s.x*9));x.fillStyle='#fff';x.beginPath();x.arc(s.x*W,s.y*H,s.s,0,TAU);x.fill()});x.globalAlpha=1;
let y0=laneY(0),y1=laneY(1);x.strokeStyle='rgba(100,220,255,.13)';x.lineWidth=2;for(let i=0;i<12;i++){let xx=(i*W/8-(elapsed*speed()*.35)% (W/8));x.beginPath();x.moveTo(xx,y0);x.lineTo(xx+W*.12,y0);x.stroke();x.beginPath();x.moveTo(xx,y1);x.lineTo(xx+W*.12,y1);x.stroke()}x.strokeStyle='rgba(110,230,255,.55)';x.shadowBlur=18;x.shadowColor='#53d8ff';x.beginPath();x.moveTo(0,y0);x.lineTo(W,y0);x.stroke();x.beginPath();x.moveTo(0,y1);x.lineTo(W,y1);x.stroke();x.shadowBlur=0;
obs.forEach(o=>drawObs(o));drawPlayer();particles.forEach(p=>{x.globalAlpha=Math.max(0,p.life);x.fillStyle='#7df5ff';x.shadowBlur=12;x.shadowColor='#36d9ff';x.beginPath();x.arc(p.x,p.y,p.size,0,TAU);x.fill()});x.globalAlpha=1;if(state==='play')drawHud();if(state==='menu')drawMenu();if(state==='over')drawOver();if(flash){x.fillStyle='rgba(255,255,255,'+flash*.45+')';x.fillRect(0,0,W,H)}}
function drawObs(o){let y=laneY(o.lane);x.save();x.translate(o.x,y);x.rotate(o.type==='diamond'?o.spin:0);x.shadowBlur=18;x.shadowColor='#ff4fd8';x.strokeStyle='#ff75e8';x.fillStyle='rgba(255,62,190,.18)';x.lineWidth=3;if(o.type==='block'){round(-o.w/2,-o.h/2,o.w,o.h,10);x.fill();x.stroke()}else if(o.type==='diamond'){x.beginPath();x.moveTo(0,-o.h/2);x.lineTo(o.w/2,0);x.lineTo(0,o.h/2);x.lineTo(-o.w/2,0);x.closePath();x.fill();x.stroke()}else if(o.type==='bar'){round(-o.w/2,-o.h/2,o.w,o.h,9);x.fill();x.stroke();for(let i=-35;i<40;i+=20){x.beginPath();x.moveTo(i,-o.h/2);x.lineTo(i+18,o.h/2);x.stroke()}}else{x.beginPath();x.arc(0,0,o.h/2,0,TAU);x.fill();x.stroke();x.beginPath();x.arc(-7,-7,5,0,TAU);x.stroke()}x.restore()}
function drawPlayer(){let z=player.t<1?1.12:1; x.save();x.translate(px(),player.y);x.rotate(player.rot);x.scale(z,z);x.shadowBlur=28;x.shadowColor='#48eaff';let gr=x.createRadialGradient(-5,-6,2,0,0,22);gr.addColorStop(0,'#fff');gr.addColorStop(.35,'#8ff5ff');gr.addColorStop(1,'#3bb7ff');x.fillStyle=gr;x.beginPath();x.arc(0,0,17,0,TAU);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke();x.shadowBlur=0;x.fillStyle='#09111d';x.beginPath();x.arc(6,-4,3,0,TAU);x.fill();x.restore()}
function drawHud(){x.fillStyle='#fff';x.font='800 28px system-ui';x.textAlign='left';x.fillText(score,24,48);x.font='600 12px system-ui';x.fillStyle='rgba(255,255,255,.55)';x.fillText('SCORE',25,65);if(combo>=2){x.textAlign='center';x.font='900 20px system-ui';x.fillStyle='#7df5ff';x.shadowBlur=12;x.shadowColor='#7df5ff';x.fillText(combo+'x COMBO',W/2,52);x.shadowBlur=0}x.textAlign='right';x.fillStyle='rgba(255,255,255,.5)';x.font='600 12px system-ui';x.fillText('BEST '+best,W-24,43)}
function panel(){x.fillStyle='rgba(5,7,18,.72)';x.fillRect(0,0,W,H)}function drawMenu(){panel();x.textAlign='center';x.font='900 '+Math.min(72,W*.16)+'px system-ui';x.fillStyle='#fff';x.shadowBlur=28;x.shadowColor='#43ddff';x.fillText('FLIPFALL',W/2,H*.27);x.shadowBlur=0;x.font='700 14px system-ui';x.fillStyle='#78eaff';x.fillText('ONE TAP. ONE CHANCE.',W/2,H*.32);button(W/2,H*.52,210,62,'PLAY');x.font='600 13px system-ui';x.fillStyle='rgba(255,255,255,.55)';x.fillText('BEST  '+best,W/2,H*.68);x.font='500 12px system-ui';x.fillText('TAP TO FLIP • SURVIVE • COMBO',W/2,H*.75)}
function drawOver(){panel();x.textAlign='center';x.font='900 46px system-ui';x.fillStyle='#fff';x.fillText('GAME OVER',W/2,H*.29);x.font='800 30px system-ui';x.fillStyle='#7df5ff';x.fillText(score,W/2,H*.39);x.font='600 12px system-ui';x.fillStyle='rgba(255,255,255,.55)';x.fillText('SCORE',W/2,H*.43);if(score>=best){x.fillStyle='#ff7ee8';x.font='800 14px system-ui';x.fillText('NEW BEST!',W/2,H*.48)}else{x.fillStyle='rgba(255,255,255,.55)';x.font='600 13px system-ui';x.fillText('BEST  '+best,W/2,H*.48)}button(W/2,H*.61,210,58,'TRY AGAIN');button(W/2,H*.71,210,52,'HOME',true)}
function button(cx,cy,w,h,label,secondary=false){x.save();x.shadowBlur=secondary?0:22;x.shadowColor='#36d9ff';x.fillStyle=secondary?'rgba(255,255,255,.06)':'rgba(58,216,255,.16)';x.strokeStyle=secondary?'rgba(255,255,255,.2)':'#55e6ff';x.lineWidth=2;round(cx-w/2,cy-h/2,w,h,18);x.fill();x.stroke();x.shadowBlur=0;x.fillStyle='#fff';x.font='900 17px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(label,cx,cy);x.restore()}
function round(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function hit(px,py){if(state==='menu'){if(py>H*.46&&py<H*.58){reset();return}}else if(state==='over'){if(py>H*.55&&py<H*.67){reset();return}if(py>H*.67&&py<H*.77){state='menu';return}}else flip()}
c.addEventListener('pointerdown',e=>{e.preventDefault();hit(e.clientX,e.clientY)});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();hit(W/2,H/2)}});
function loop(t){let dt=Math.min(.032,(t-last)/1000||0);last=t;update(dt);let ox=(Math.random()-.5)*shake,oy=(Math.random()-.5)*shake;x.save();x.translate(ox,oy);draw();x.restore();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
